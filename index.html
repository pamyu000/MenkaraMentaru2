<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メンカラメンタル診断</title>
<meta name="description" content="担当（推し）のメンカラとあなたのメンタルとの共鳴タイプを診断します。">
<style>
:root{--bg:#f7f5f2;--card:#fff;--text:#262321;--muted:#716b66;--line:#e5dfd9;--accent:#6c5ce7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{max-width:720px;margin:auto;padding:28px 16px 56px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.035)}
h1{font-size:28px;margin:0 0 8px}.lead{color:var(--muted);margin:0}.qnum{font-size:13px;color:var(--accent);font-weight:700}.question{font-size:19px;font-weight:700;margin:4px 0 14px}
.option{display:block;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;cursor:pointer;background:#fff}
.option:has(input:checked){border-color:var(--accent);background:#f3f1ff}.option input{margin-right:8px}
button{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#262321;color:#fff}
button.secondary{background:#eeeae6;color:#262321}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hidden{display:none}.error{color:#a33b3b;font-size:14px;margin-top:8px}.result-code{color:var(--muted);font-size:13px}
.result-title{font-size:25px;line-height:1.35;margin:4px 0 12px}.tagline{font-weight:700}.meaning{border-left:4px solid var(--accent);padding:10px 14px;background:#f6f4ff;border-radius:8px;margin-top:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#f7f5f2;border-radius:14px}.stat strong{font-size:20px;display:block}
.small{font-size:13px;color:var(--muted)}a{color:inherit}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>メンカラメンタル診断</h1>
<p class="lead">今からあなたの担当（推し）のメンカラとあなたのメンタルとの共鳴タイプを診断します。</p>
</section>

<div id="app"></div>
<footer>この診断では、診断結果の統計に必要な回答データを匿名で集計します。名前やメールアドレスは収集しません。</footer>
</main>

<script>
const API_URL = ""; // Google Apps Script公開URLをここに設定
const TYPES = {
"01": ["運命の色一致型","好きな色とメンカラが一致した、奇跡の人","もともと好きだった色が、偶然担当（推し）のメンカラだったあなた。「この色が好き」と「この人が好き」が最初から重なっているため、メンカラへの愛着もかなり強め。","運命の証"],
"02": ["メンカラプレミア化型","好きな色に担当（推し）という付加価値がついた人","もともと好きだった色だけど、担当（推し）のメンカラになったことでさらに特別な存在に。街中でその色を見るだけで担当（推し）を思い出すこともありそう。","好きな色＋担当（推し）＝最強"],
"03": ["メンカラ沼深化型","好きだった色が、担当（推し）によってもっと好きになった人","もともと好きだったところに、衣装・グッズ・写真・ライブなどで大量のメンカラを浴びた結果、さらに好きになったタイプ。","担当（推し）によって深まった愛"],
"04": ["メンカラ永久保存型","この色だけは、いつまでも担当（推し）の色","色そのものも好きだけど、それ以上に「担当（推し）の色」という意味が強いタイプ。もし担当を降りたとしても、その色を見るとちょっと思い出してしまうかも。","思い出を保存する色"],
"05": ["新境地開拓型","担当（推し）のおかげで新しい色の魅力を知った人","もともとは特に好きでも嫌いでもなかったけれど、担当（推し）をきっかけにその色の魅力を発見。今では担当（推し）抜きでも「この色、結構いいな」と思えるタイプ。","担当（推し）が教えてくれた新しい世界"],
"06": ["メンカラ信仰型","色が好きなんじゃない。担当（推し）の色だから好き。","色そのものへの興味よりも、「担当（推し）の色」という意味に強く反応するタイプ。他の人が同じ色を担当していても、あなたの中ではやっぱり「担当（推し）の色」。","担当（推し）そのもの"],
"07": ["色彩侵食型","見すぎて、いつの間にか好きになっていた人","最初は何とも思っていなかったのに、担当（推し）の写真、衣装、グッズ、ペンライト……とにかくメンカラを浴び続けた結果、気づけばその色が好きになっていたタイプ。","知らないうちに染み込んだ色"],
"08": ["オタ活限定愛好型","普段は選ばない。でも担当（推し）なら話は別。","日常生活では特にその色を選ばないのに、オタ活になると急にその色がしっくりくるタイプ。「普段の自分」と「オタクの自分」で色の好みがちょっと違うかも。","オタ活専用カラー"],
"09": ["生粋の色オタク型","担当（推し）がいなくても、その色が好き。","担当（推し）の存在とは関係なく、純粋にその色そのものが好きなタイプ。担当（推し）がその色じゃなくなったとしても、たぶんその色を好きでい続ける。","純粋な好み"],
"10": ["メンカラ日常化型","気づけば生活にメンカラがいる。","もともとの色の好みと担当（推し）の影響が合わさって、服・小物・ネイル・スマホケースなど、日常生活にもその色が自然と入り込んでいるタイプ。","生活の一部"],
"11": ["色単体推し型","担当（推し）とは別に、この色が好き。","担当（推し）のメンカラであることは嬉しいけれど、色への好意はあくまで色への好意。「担当（推し）がこの色だから好き」ではなく、「この色が好きだし、担当（推し）もこの色で嬉しい」というタイプ。","担当（推し）とは独立した好き"],
"12": ["メンカラ聖域型","この色は、担当（推し）のための特別枠。","普段から色そのものが好きだけど、担当（推し）のメンカラになると意味が変わるタイプ。同じ色でも「普段の色」と「担当（推し）の色」は別物。","聖域"],
"13": ["後天的カラー愛型","嫌いだった色まで、担当（推し）のために好きになった。","もともとはあまり好きではなかった、あるいは苦手だった色。それなのに担当（推し）を追い続けるうちに、いつの間にか「この色、意外と好きかも」と思うようになったタイプ。","担当（推し）が変えた色の好み"],
"14": ["メンカラ定着型","好きなのは色じゃなくて担当（推し）。でも色も定着した。","色そのものに強いこだわりがあるわけではないのに、オタ活をしているうちに自然とその色を身につけたり選んだりするようになったタイプ。","オタ活の習慣"],
"15": ["色と担当（推し）の分離型","担当（推し）は担当（推し）、色は色。","担当（推し）は大好き。でもメンカラを見ても必ずしも担当（推し）を連想するわけではないタイプ。「この色＝担当（推し）！」という結びつきは比較的ゆるめ。","担当（推し）とは別ジャンル"],
"16": ["メンカラ一点集中型","色そのものより、“担当（推し）の色”であることが大事。","その色自体には特別な思い入れはないけれど、担当（推し）の色としては大切。担当（推し）が別の色になったら、その新しい色にも気持ちが移る可能性が高いタイプ。","担当（推し）を示す目印"]
};
const SUB = {
4:["メンカラ反転型","好きだったはずなのに、見すぎて苦手になった"],
5:["メンカラ飽和型","グッズも衣装も何もかもその色。もうお腹いっぱい。"],
3:["メンカラ複雑型","その色を見ると担当（推し）を思い出す。でも、今はちょっと複雑。"],
6:["メンカラ理由不明型","特に理由はないけど、気づいたら苦手になった。"],
7:["メンカラその他型","その色が苦手になった理由は、ほかにある。"]
};

const QUESTIONS = [
["q1","Q1. 担当（推し）になる前、その色は？",["大好きだった","好きだった","特に何とも思ってなかった","あまり好きじゃなかった","苦手・嫌いだった"]],
["q2","Q2. 担当（推し）のメンカラだと知ってから、その色への気持ちは？",["もっと好きになった","少し好きになった","特に変わらない","少し苦手になった","むしろ嫌いになった"]],
["q3","Q3. 今、その色を担当（推し）抜きで見たら？",["普通に好き","まあまあ好き","特に何とも思わない","あまり好きじゃない","やっぱり苦手"]],
["q4","Q4. 街中でメンカラを見つけたら？",["「担当（推し）だ！！」ってなる","ちょっと嬉しくなる","特に何も思わない","担当（推し）を連想するけど、ちょっと複雑","できれば見たくない"]],
["q5","Q5. 担当（推し）が別のメンカラになったら？",["今のメンカラも好きだし、新しい色も好きになると思う","今のメンカラへの愛着は残る","担当（推し）の色なら何色でも好きになると思う","今のメンカラだからこそ好きなので、ちょっと寂しい","むしろ別の色になってほしい"]]
];
const EXTRA=["extra","どうしてその色が苦手になったと思う？",["見すぎて飽きた","グッズなどで大量に見て疲れた","「担当（推し）の色」というイメージが強くなりすぎた","元々好きだったのに、担当（推し）の色として扱われるのが嫌になった","担当（推し）との思い出がその色に結びついている","特に理由はないけど苦手になった","その他"]];

function getAnswers(){
 const a={}; QUESTIONS.forEach(([id])=>a[id]=Number(document.querySelector(`input[name="${id}"]:checked`)?.value||0));
 if(a.q2>=4) a.extra=Number(document.querySelector('input[name="extra"]:checked')?.value||0);
 return a;
}
function validate(a){
 for(const [id] of QUESTIONS) if(!a[id]) return "すべての質問に回答してください。";
 if(a.q2>=4 && !a.extra) return "苦手になった理由も選んでください。";
 return "";
}
/* 16タイプ判定:
   Q1/Q2/Q3で色そのものの変化、Q4/Q5で担当（推し）との結びつきを測る。
   Q2=4/5はメインタイプを維持し、別軸のサブタイプとして記録。 */
function calc(a){
 const q1=a.q1,q2=a.q2,q3=a.q3,q4=a.q4,q5=a.q5;
 if(q1<=2){
   if(q2===1 && q4===1) return q1===1 && q3<=2 ? "01":"03";
   if(q2<=2 && q4<=2) return q5===2 ? "02":"03";
   if(q2===3 && q4>=3) return q4===3 ? "09":"11";
   if(q4===1) return "12";
   return q5===2 ? "04":"11";
 }
 if(q1===3){
   if(q2<=2 && q3<=2) return q4===1 ? "07":"05";
   if(q2<=2 && q3>=3) return q4<=2 ? "06":"08";
   if(q2===3) return q4===1 ? "16":(q5===2 ? "14":"08");
   return q4<=2 ? "06":"15";
 }
 if(q1>=4){
   if(q2<=2 && q3<=2) return q4===1 ? "13":"05";
   if(q2===3) return q4<=2 ? "14":"15";
   if(q2>=4) return q4<=2 ? "06":"16";
 }
 return "15";
}
function typePage(code, sub){
 const t=TYPES[code]; const shareText=`メンカラメンタル診断をやってみた！「${t[0]}」でした。 #メンカラメンタル診断`;
 const url=location.origin+location.pathname+"?result="+code+(sub?`&sub=${sub}`:"");
 return `<section class="card">
 <div class="result-code">診断結果 ${code}</div><h2 class="result-title">${t[0]}</h2><p class="tagline">${t[1]}</p><p>${t[2]}</p>
 <div class="meaning"><strong>あなたにとってメンカラとは？</strong><br>→ ${t[3]}</div>
 ${sub?`<div class="meaning"><strong>メンカラ変化タイプ</strong><br>${SUB[sub][0]}<br>${SUB[sub][1]}</div>`:""}
 <div class="buttons">
 <button onclick="shareX()">Xでシェア</button><button class="secondary" onclick="copyResult()">結果リンクをコピー</button>
 <button class="secondary" onclick="showStats()">みんなの結果を見る</button>
 </div>
 </section><div id="stats"></div>`;
}
let currentCode="", currentSub="";
function renderQuiz(){
 let h=`<form id="quiz">`;
 QUESTIONS.forEach(([id,title,opts],i)=>{h+=`<section class="card"><div class="qnum">${i+1}/5</div><div class="question">${title}</div>`+opts.map((x,j)=>`<label class="option"><input type="radio" name="${id}" value="${j+1}">${j+1}．${x}</label>`).join("")+`</section>`});
 h+=`<section class="card hidden" id="extraCard"><div class="qnum">追加質問</div><div class="question">${EXTRA[1]}</div>`+EXTRA[2].map((x,j)=>`<label class="option"><input type="radio" name="extra" value="${j+1}">${j+1}．${x}</label>`).join("")+`</section>`;
 h+=`<div class="card"><div id="error" class="error"></div><button type="submit">診断結果を見る</button></div></form>`;
 document.getElementById("app").innerHTML=h;
 document.querySelectorAll('input[name="q2"]').forEach(el=>el.addEventListener("change",()=>document.getElementById("extraCard").classList.toggle("hidden",Number(el.value)<4)));
 document.getElementById("quiz").addEventListener("submit",e=>{e.preventDefault();const a=getAnswers(),err=validate(a);if(err){document.getElementById("error").textContent=err;return;}const code=calc(a);const sub=a.q2>=4?a.extra:"";showResult(code,sub,a);});
}
function showResult(code,sub,a){
 currentCode=code;currentSub=sub;history.replaceState({}, "", "?result="+code+(sub?`&sub=${sub}`:""));
 document.getElementById("app").innerHTML=typePage(code,sub);
 if(API_URL) sendStats(a,code,sub);
}
async function sendStats(a,code,sub){
 try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({q1:a.q1,q2:a.q2,q3:a.q3,q4:a.q4,q5:a.q5,extra:a.extra||null,resultType:code,subType:sub||null,createdAt:new Date().toISOString().slice(0,10)})});}catch(e){}
}
function shareX(){const t=TYPES[currentCode];const u=encodeURIComponent(location.href);const tx=encodeURIComponent(`メンカラメンタル診断をやってみた！「${t[0]}」でした。 #メンカラメンタル診断`);window.open(`https://twitter.com/intent/tweet?text=${tx}&url=${u}`,"_blank");}
async function copyResult(){try{await navigator.clipboard.writeText(location.href);alert("結果リンクをコピーしました。");}catch(e){prompt("このリンクをコピーしてください",location.href)}}
async function showStats(){
 const el=document.getElementById("stats");el.innerHTML=`<section class="card"><h2>みんなの結果</h2><p class="small">統計データを読み込んでいます。</p></section>`;
 if(!API_URL){el.innerHTML=`<section class="card"><h2>みんなの結果</h2><p>統計機能を使うには、Google Apps Scriptの公開URLを設定してください。</p></section>`;return;}
 try{const r=await fetch(API_URL+"?action=stats");const d=await r.json();renderStats(d)}catch(e){el.innerHTML=`<section class="card"><h2>みんなの結果</h2><p>統計データを読み込めませんでした。</p></section>`}
}
function renderStats(d){
 const total=d.total||0;let h=`<section class="card"><h2>みんなの結果</h2><p>現在 <strong>${total.toLocaleString()}</strong>人が診断しました。</p><div class="stat-grid">`;
 Object.entries(d.results||{}).forEach(([code,n])=>h+=`<div class="stat"><strong>${total?Math.round(n/total*1000)/10:0}%</strong>${code}｜${TYPES[code]?.[0]||code}<br><span class="small">${n.toLocaleString()}人</span></div>`);
 h+=`</div><p class="small">回答データは診断結果の集計に使用しています。</p></section>`;document.getElementById("stats").innerHTML=h;
}
function load(){
 const p=new URLSearchParams(location.search),code=p.get("result"),sub=p.get("sub");
 if(code&&TYPES[code]){currentCode=code;currentSub=sub||"";document.getElementById("app").innerHTML=typePage(code,sub||"");}
 else renderQuiz();
}
load();
</script>
</body></html>
